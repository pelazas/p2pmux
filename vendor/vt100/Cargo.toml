[package]
name = "vt100"
version = "0.16.2"
edition = "2021"
rust-version = "1.70"
authors = ["Jesse Luehrs <doy@tozt.net>"]
description = "Library for parsing terminal data"
license = "MIT"
repository = "https://github.com/doy/vt100-rust"
publish = false

# vt100 0.16.2, with the SGR attributes and focus-event mode p2pmux has to
# carry through a pane. The crates.io release stores bold, dim, italic,
# underline, inverse and two colours, and drops everything else on parse.

[dependencies]
itoa = "1.0.15"
unicode-width = "0.2.1"
vte = "0.15.0"
