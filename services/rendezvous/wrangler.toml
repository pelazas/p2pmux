name = "p2pmux-rendezvous"
main = "src/index.js"
compatibility_date = "2026-07-30"
workers_dev = true

# Its own subdomain, so an incident here cannot take the landing page down with it.
[[routes]]
pattern = "rv.p2pmux.com"
custom_domain = true

# The blind store. Values are sealed by the client, so a dump of this namespace yields
# nothing but ciphertext and expiry times.
[[kv_namespaces]]
binding = "RECORDS"
id = "a1701ce037f04a87af5325e533a9a658"

# Writes only — see the note in src/index.js on why reads are not limited.
[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[observability]
enabled = true
