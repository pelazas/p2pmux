name: Release

# Tag-driven so the artifacts and the tag can never disagree: whatever `v*` points at is what
# gets built, hashed and published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both architectures of both platforms, each built natively. Linux is pinned to 22.04
        # rather than `latest` on purpose: a binary links the glibc it was built against or
        # newer, so building on 24.04 would raise the floor to glibc 2.39 and refuse to start
        # on Debian 12 and Ubuntu 22.04, which are what a lot of servers still are.
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Sign
        # arm64 refuses to exec an unsigned binary. A local `cargo build` gets an ad-hoc
        # signature for free; a CI-built artifact does not, so it has to be applied here or the
        # download fails at run time on exactly the machines most people have.
        #
        # A Linux binary has no such requirement and no `codesign` to apply it with.
        if: runner.os == 'macOS'
        run: |
          codesign -s - --force --timestamp=none \
            target/${{ matrix.target }}/release/p2pmux
          codesign -v target/${{ matrix.target }}/release/p2pmux

      - name: Package
        # tar rather than zip on purpose: an archive downloaded by a browser carries the
        # Gatekeeper quarantine flag, and `curl | tar` does not.
        run: |
          set -euo pipefail
          asset="p2pmux-${{ matrix.target }}.tar.gz"
          tar -czf "$asset" -C "target/${{ matrix.target }}/release" p2pmux
          # The same hash under two names: macOS ships `shasum`, Linux ships `sha256sum`, and
          # both print the one line `install.sh` and the publish job read back.
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$asset" > "$asset.sha256"
          else
            sha256sum "$asset" > "$asset.sha256"
          fi
          cat "$asset.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            p2pmux-${{ matrix.target }}.tar.gz
            p2pmux-${{ matrix.target }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Verify every archive against its published hash
        # The hash is what `install.sh` trusts, so a mismatch here has to stop the release
        # rather than publish a checksum nobody validated.
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          for sum in *.sha256; do
            sha256sum -c "$sum"
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Install

            ```sh
            curl -fsSL https://p2pmux.com/install.sh | sh
            ```

            or

            ```sh
            brew tap pelazas/tap      # macOS
            brew trust pelazas/tap    # Homebrew 6+ refuses untrusted third-party taps
            brew install p2pmux
            ```

            macOS and Linux, on both architectures.

            Prefer to build it yourself:

            ```sh
            cargo install --git https://github.com/pelazas/p2pmux --locked
            ```

            Every archive is published with its SHA256 beside it, and `install.sh` checks it
            before installing anything.

            **A p2pmux session is a trusted shared shell.** Whoever holds a join code can run
            commands as your user account. https://p2pmux.com/trust
