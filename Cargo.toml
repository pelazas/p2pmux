[package]
name = "p2pmux"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "A peer-to-peer terminal multiplexer where every pane runs on its owner's machine"
authors = ["Carlos Pelazas"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/pelazas/p2pmux"
homepage = "https://p2pmux.com"
documentation = "https://github.com/pelazas/p2pmux/blob/main/docs/USAGE.md"
keywords = ["terminal", "multiplexer", "tui", "p2p", "collaboration"]
categories = ["command-line-utilities", "network-programming"]
exclude = [
    "docs/assets/*",
    "scripts/",
    "services/",
    "tests/",
    ".github/",
]

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
getrandom = "0.3"
iroh = "1.0.3"
portable-pty = "0.9"
postcard = { version = "1", features = ["alloc"] }
reqwest = { version = "0.13", default-features = false, features = ["query", "rustls-no-provider", "system-proxy"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "io-util"] }
toml = "0.8"
toml_edit = "0.22"
vt100 = "0.16"
unicode-width = "0.2"
